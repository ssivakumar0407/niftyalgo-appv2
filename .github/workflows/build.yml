          rm -f app/src/main/java/com/niftyalgo/app/*.orig
          find app/src -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build 3 APKs (1 base / 2 menu / 3 full)
        run: |
          set -e
          F=app/src/main/java/com/niftyalgo/app/MainActivity.java
          S=app/src/main/res/values/strings.xml
          cp "$F" /tmp/Main.new
          cp "$S" /tmp/strings.orig
          mkdir -p out

          variant() {
            # $1 = file label, $2 = menu on/off, $3 = lock on/off
            cp /tmp/Main.new "$F"
            [ "$2" = "off" ] && sed -i 's/ENABLE_MENU = true/ENABLE_MENU = false/' "$F"
            [ "$3" = "off" ] && sed -i 's/ENABLE_LOCK = true/ENABLE_LOCK = false/' "$F"
            cp /tmp/strings.orig "$S"
            sed -i "s#>Nifty Algo</string>#>Nifty Algo $1</string>#" "$S"
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "out/NiftyAlgo-$1.apk"
          }

          variant 1-base off off
          variant 2-menu on  off
          variant 3-full on  on
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NiftyAlgo-apk
          path: out/*.apk
