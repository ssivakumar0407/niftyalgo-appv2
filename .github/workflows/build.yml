      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build 5 test APKs
        run: |
          set -e
          F=app/src/main/java/com/niftyalgo/app/MainActivity.java
          S=app/src/main/res/values/strings.xml
          cp "$F" /tmp/Main.new
          cp "$S" /tmp/strings.orig
          mkdir -p out

          variant() {
            # $1 = file label, $2 = handler, $3 = menu, $4 = lock
            cp /tmp/Main.new "$F"
            [ "$2" = "off" ] && sed -i 's/ENABLE_HANDLER = true/ENABLE_HANDLER = false/' "$F"
            [ "$3" = "off" ] && sed -i 's/ENABLE_MENU = true/ENABLE_MENU = false/' "$F"
            [ "$4" = "off" ] && sed -i 's/ENABLE_LOCK = true/ENABLE_LOCK = false/' "$F"
            cp /tmp/strings.orig "$S"
            sed -i "s#>Nifty Algo</string>#>Nifty Algo $1</string>#" "$S"
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "out/NiftyAlgo-$1.apk"
          }

          variant 1-plain      off off off
          variant 2-errorscreen on off off
          variant 3-menu       off on  off
          variant 4-menu-lock  off on  on
          variant 5-full       on  on  on
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NiftyAlgo-apk
          path: out/*.apk
