name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write server address into the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Add repository variable APP_URL (Settings > Secrets and variables > Actions > Variables), e.g. http://1.2.3.4"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape
          url = os.environ["APP_URL"].strip()
          with open("app/src/main/res/values/app_url.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                      '    <string name="app_url" translatable="false">%s</string>\n</resources>\n' % escape(url))
          PY

      - name: Write correct Gradle files (so manual edits cannot break the build)
        run: |
          cat > build.gradle <<'EOF2'
          // Root build file - intentionally empty. Plugin versions are set in settings.gradle.
          EOF2
          cat > settings.gradle <<'EOF2'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id 'com.android.application' version '8.5.2'
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NiftyAlgo"
          include ':app'
          EOF2
          cat > app/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.niftyalgo.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.niftyalgo.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF2
          echo "--- repo tree ---"; find . -path ./.git -prune -o -type f -print | sort

