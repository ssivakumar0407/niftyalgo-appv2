          cat > app/src/main/java/com/niftyalgo/app/LauncherActivity.java <<'J3END'
          package com.niftyalgo.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;

          /** Tiny start screen: if the app crashed last time, show the error; otherwise open the real app. */
          public class LauncherActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final File f = new File(getFilesDir(), "last_crash.txt");
                  String crash = null;
                  try {
                      if (f.exists()) {
                          StringBuilder sb = new StringBuilder();
                          BufferedReader r = new BufferedReader(new FileReader(f));
                          String line;
                          while ((line = r.readLine()) != null && sb.length() < 3500) sb.append(line).append('\n');
                          r.close();
                          crash = sb.toString();
                      }
                  } catch (Throwable ignored) { }
                  if (crash == null || crash.trim().isEmpty()) {
                      openApp();
                      return;
                  }
                  final String text = crash;
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setBackgroundColor(Color.parseColor("#0B1220"));
                  int p = Math.round(16 * getResources().getDisplayMetrics().density);
                  col.setPadding(p, p * 2, p, p);
                  TextView h = new TextView(this);
                  h.setText("Nifty Algo hit an error last time");
                  h.setTextColor(Color.parseColor("#FF8A8A"));
                  h.setTextSize(18);
                  TextView hint = new TextView(this);
                  hint.setText("Please send a screenshot of this screen (or tap Copy error).");
                  hint.setTextColor(Color.parseColor("#8FA0BF"));
                  hint.setTextSize(13);
                  ScrollView sv = new ScrollView(this);
                  TextView body = new TextView(this);
                  body.setText(text);
                  body.setTextColor(Color.parseColor("#E6EDF7"));
                  body.setTextSize(10);
                  body.setTypeface(Typeface.MONOSPACE);
                  body.setTextIsSelectable(true);
                  sv.addView(body);
                  Button copy = new Button(this);
                  copy.setText("Copy error");
                  copy.setAllCaps(false);
                  copy.setOnClickListener(v -> {
                      ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cb.setPrimaryClip(ClipData.newPlainText("error", text));
                      Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show();
                  });
                  Button go = new Button(this);
                  go.setText("Clear error and open app");
                  go.setAllCaps(false);
                  go.setOnClickListener(v -> {
                      f.delete();
                      openApp();
                  });
                  col.addView(h);
                  col.addView(hint);
                  col.addView(sv, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  col.addView(copy);
                  col.addView(go);
                  setContentView(col);
              }

              private void openApp() {
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }
          }
          J3END
          cat > app/src/main/java/com/niftyalgo/app/GateCallback.java <<'J4END'
          package com.niftyalgo.app;

          /** Result of the fingerprint check (kept separate so MainActivity does not depend on fingerprint classes). */
          interface GateCallback {
              void onSuccess();
              void onError(String msg);
          }
          J4END
          cat > app/src/main/java/com/niftyalgo/app/LockGate.java <<'J5END'
          package com.niftyalgo.app;

          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;

          /** All fingerprint code. Only loaded when the lock is switched on. */
          final class LockGate {
              private static final int AUTH = BiometricManager.Authenticators.BIOMETRIC_WEAK
                      | BiometricManager.Authenticators.DEVICE_CREDENTIAL;

              private final FragmentActivity act;
              private final BiometricPrompt prompt;
              private final BiometricPrompt.PromptInfo info;

              LockGate(FragmentActivity a, final GateCallback cb) {
                  act = a;
                  prompt = new BiometricPrompt(a, ContextCompat.getMainExecutor(a),
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                                  cb.onSuccess();
                              }

                              @Override
                              public void onAuthenticationError(int code, CharSequence msg) {
                                  cb.onError(String.valueOf(msg));
                              }
                          });
                  info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Unlock Nifty Algo")
                          .setSubtitle("Use your fingerprint or screen lock")
                          .setAllowedAuthenticators(AUTH)
                          .build();
              }

              boolean available() {
                  return BiometricManager.from(act).canAuthenticate(AUTH) == BiometricManager.BIOMETRIC_SUCCESS;
              }

              void authenticate() {
                  prompt.authenticate(info);
              }
          }
          J5END
